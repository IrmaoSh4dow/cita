<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#e7c8c6" />
    <meta name="description" content="Una pequeña aventura en cuatro lugares." />
    <title>Para Valentina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="hearts" aria-hidden="true">
      <i class="drift" style="--x: 8%; --y: 12%; --s: 54px; --d: 16s; --o: 0.16; --r: -18deg; --c: #c45c6e"></i>
      <i class="drift" style="--x: 82%; --y: 18%; --s: 72px; --d: 20s; --o: 0.12; --r: 14deg; --c: #b08968"></i>
      <i class="drift" style="--x: 76%; --y: 72%; --s: 46px; --d: 18s; --o: 0.14; --r: -8deg; --c: #a84d62"></i>
      <i class="drift" style="--x: 12%; --y: 74%; --s: 38px; --d: 22s; --o: 0.18; --r: 10deg; --c: #c45c6e"></i>
      <i style="--x: 4%; --s: 16px; --d: 15s; --delay: -2s; --o: 0.55; --r: -12deg; --dx: 24px; --c: #c45c6e"></i>
      <i style="--x: 12%; --s: 11px; --d: 12s; --delay: -7s; --o: 0.4; --r: 8deg; --dx: -16px; --c: #b08968"></i>
      <i style="--x: 20%; --s: 22px; --d: 19s; --delay: -4s; --o: 0.35; --r: -20deg; --dx: 30px; --c: #a84d62"></i>
      <i style="--x: 28%; --s: 13px; --d: 14s; --delay: -11s; --o: 0.5; --r: 16deg; --dx: -10px; --c: #c97b88"></i>
      <i style="--x: 36%; --s: 18px; --d: 21s; --delay: -1s; --o: 0.28; --r: -6deg; --dx: 18px; --c: #b08968"></i>
      <i style="--x: 46%; --s: 12px; --d: 13s; --delay: -9s; --o: 0.45; --r: 12deg; --dx: -22px; --c: #c45c6e"></i>
      <i style="--x: 54%; --s: 26px; --d: 23s; --delay: -6s; --o: 0.22; --r: -14deg; --dx: 14px; --c: #a84d62"></i>
      <i style="--x: 63%; --s: 14px; --d: 16s; --delay: -3s; --o: 0.48; --r: 6deg; --dx: 20px; --c: #c97b88"></i>
      <i style="--x: 71%; --s: 19px; --d: 18s; --delay: -12s; --o: 0.34; --r: -18deg; --dx: -18px; --c: #b08968"></i>
      <i style="--x: 80%; --s: 12px; --d: 11s; --delay: -5s; --o: 0.5; --r: 20deg; --dx: 12px; --c: #c45c6e"></i>
      <i style="--x: 88%; --s: 24px; --d: 20s; --delay: -8s; --o: 0.3; --r: -10deg; --dx: -26px; --c: #a84d62"></i>
      <i style="--x: 94%; --s: 15px; --d: 17s; --delay: -14s; --o: 0.42; --r: 4deg; --dx: 8px; --c: #c97b88"></i>
      <i style="--x: 8%; --s: 28px; --d: 24s; --delay: -16s; --o: 0.2; --r: 12deg; --dx: 36px; --c: #b08968"></i>
      <i style="--x: 58%; --s: 10px; --d: 10s; --delay: -2.5s; --o: 0.55; --r: -8deg; --dx: -12px; --c: #c45c6e"></i>
      <i style="--x: 33%; --s: 16px; --d: 18s; --delay: -13s; --o: 0.32; --r: 18deg; --dx: 16px; --c: #a84d62"></i>
    </div>

    <main id="app" hidden>
      <header class="top" id="top" hidden>
        <p class="wordmark" id="wordmark"></p>
        <div class="progress">
          <p class="kicker" id="progress-kicker"></p>
          <ol id="progress-list" aria-label="Progreso de la aventura"></ol>
        </div>
      </header>

      <section class="view" data-view="intro" hidden>
        <article class="letter">
          <div class="seal" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                fill="currentColor"
                d="M12 20.2s-6.8-4.2-6.8-8.8A3.9 3.9 0 0 1 12 8.2a3.9 3.9 0 0 1 6.8 3.2c0 4.6-6.8 8.8-6.8 8.8z"
              />
            </svg>
          </div>
          <h1 id="intro-title" tabindex="-1"></h1>
          <p class="salutation" id="intro-salutation"></p>
          <div id="intro-body"></div>
          <button type="button" class="button" id="start"></button>
        </article>
      </section>

      <section class="view" data-view="puzzle" hidden>
        <div class="panel">
          <div class="bloom" aria-hidden="true">
            <span style="--bx: -86px; --by: -70px"></span>
            <span style="--bx: 78px; --by: -84px"></span>
            <span style="--bx: -20px; --by: -110px"></span>
            <span style="--bx: 96px; --by: -20px"></span>
            <span style="--bx: -100px; --by: -16px"></span>
            <span style="--bx: 36px; --by: -96px"></span>
            <span style="--bx: -48px; --by: -88px"></span>
          </div>
          <h1 id="puzzle-title" tabindex="-1"></h1>
          <form id="answer-form" autocomplete="off" novalidate>
            <label class="lead" id="puzzle-lead" for="answer"></label>
            <div class="field">
              <input
                id="answer"
                type="text"
                inputmode="text"
                autocomplete="off"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="done"
              />
            </div>
            <p class="feedback" id="feedback" role="status"></p>
            <button type="submit" class="button" id="submit"></button>
          </form>
          <button type="button" class="text-button" id="back-clue" hidden></button>
        </div>
      </section>

      <section class="view" data-view="reveal" hidden>
        <article class="letter">
          <div class="seal" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                fill="currentColor"
                d="M12 20.2s-6.8-4.2-6.8-8.8A3.9 3.9 0 0 1 12 8.2a3.9 3.9 0 0 1 6.8 3.2c0 4.6-6.8 8.8-6.8 8.8z"
              />
            </svg>
          </div>
          <p class="confirmation" id="confirmation"></p>
          <h1 id="place-title" tabindex="-1"></h1>
          <div class="ornament" aria-hidden="true"><span></span></div>
          <p class="clue" id="clue"></p>
          <p class="note" id="reveal-note"></p>
          <button type="button" class="button" id="continue-btn"></button>
        </article>
      </section>

      <section class="view" data-view="gallery" hidden>
        <p class="kicker gallery-kicker" id="gallery-kicker" hidden></p>
        <h1 id="gallery-title" tabindex="-1"></h1>
        <div class="stage">
          <button type="button" class="icon-button stage-arrow stage-arrow--prev" id="prev" aria-label="Fotografía anterior">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M14.5 5.5 8 12l6.5 6.5"
              />
            </svg>
          </button>
          <figure class="gallery-figure">
            <div class="frame" id="frame">
              <div class="slide" id="slide">
                <img id="photo-fill" class="photo-fill" alt="" aria-hidden="true" draggable="false" />
                <img id="photo" alt="" draggable="false" />
                <div class="frame-empty" id="frame-empty">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="m12 2.8 1.7 5.2h5.5l-4.4 3.2 1.7 5.2L12 13.2 7.5 16.4l1.7-5.2L4.8 8h5.5z"
                    />
                  </svg>
                  <p id="pending-label"></p>
                </div>
              </div>
            </div>
            <figcaption id="caption" hidden></figcaption>
          </figure>
          <button type="button" class="icon-button stage-arrow stage-arrow--next" id="next" aria-label="Fotografía siguiente">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9.5 5.5 16 12l-6.5 6.5"
              />
            </svg>
          </button>
        </div>
        <p class="position" id="position" aria-hidden="true"></p>
        <ol class="dots" id="dots" aria-hidden="true"></ol>
        <button type="button" class="text-button restart" id="restart"></button>
        <p class="sr-only" id="slide-announcement" aria-live="polite"></p>
      </section>
    </main>

    <div class="veil" id="veil" hidden aria-hidden="true">
      <div class="veil-inner">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path
            fill="currentColor"
            d="m12 2.8 1.7 5.2h5.5l-4.4 3.2 1.7 5.2L12 13.2 7.5 16.4l1.7-5.2L4.8 8h5.5z"
          />
        </svg>
        <h2 id="veil-title"></h2>
        <span class="veil-line" aria-hidden="true"></span>
      </div>
    </div>

    <noscript>
      <main class="noscript">
        <article class="letter">
          <p class="prose">Esta página necesita JavaScript para guardar tu progreso y revelar cada pista.</p>
        </article>
      </main>
    </noscript>

    <script src="config.js"></script>
    <script src="client.js"></script>
  </body>
</html>
